<!DOCTYPE html>
<html>

<head>
    <title>Interactive 3D Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #88a0f0;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 10;
        }

        #resetBtn {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            font-family: sans-serif;
            font-weight: bold;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 20;
            transition: 0.3s;
        }
        #resetBtn:hover {
            background-color: #edecec;
        }
    </style>
</head>

<body>
    <div id="loading">Loading Model...</div>
    <button id="resetBtn">Reset View</button>

    <!-- Video Element -->
    <video id="myVideo" src="https://nichapa67.github.io/nichapa.github.io/coffee.mp4" loop muted playsinline crossorigin="anonymous" style="display:none;"></video>
    
    <!-- Core Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Shaders
        const toonVertexShader = `
            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const toonFragmentShader = `
            uniform sampler2D uTexture;
            uniform int uHasTexture;
            uniform vec3 uBaseColor;
            uniform vec3 uLightPosition;
            varying vec3 vNormal;
            varying vec3 vWorldPosition;
            varying vec2 vUv;
            void main() {
                vec3 lightDirection = normalize(uLightPosition - vWorldPosition);
                float diffuse = max(dot(vNormal, lightDirection), 0.0);
                float step1 = smoothstep(0.2, 0.25, diffuse) * 0.4;
                float step2 = smoothstep(0.6, 0.65, diffuse) * 0.6;
                diffuse = step1 + step2;
                float lightIntensity = clamp(diffuse + 0.35, 0.0, 1.0);
                vec4 texColor = vec4(uBaseColor, 1.0);
                if (uHasTexture == 1) {
                    texColor = texture2D(uTexture, vUv);
                }
                gl_FragColor = vec4(texColor.rgb * lightIntensity, texColor.a);
            }
        `;

        const fishVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                pos.y += sin(uTime * 2.0) * 1.5;
                pos.x += sin(pos.z * 3.0 + uTime * 4.0) * 0.5;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fishFragmentShader = `
            uniform sampler2D uTexture;
            uniform int uHasTexture;
            uniform vec3 uColor;
            varying vec2 vUv;
            void main() {
                vec4 color = vec4(uColor, 1.0);
                if (uHasTexture == 1) {
                    color = texture2D(uTexture, vUv);
                }
                gl_FragColor = color;
            }
        `;

        const fishShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: fishVertexShader,
            fragmentShader: fishFragmentShader,
            uniforms: {
                uTime: { value: 0.0 },
                uTexture: { value: null },
                uHasTexture: { value: 0 },
                uColor: { value: new THREE.Color(0xff7700) }
            },
            side: THREE.DoubleSide
        });

        const seaweedVertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            void main() {
                vUv = uv;
                vec3 pos = position;
                float swayStrength = pow(uv.y, 1.5) * 0.8;
                pos.x += sin(uTime * 2.5 + pos.y * 3.0) * swayStrength;
                pos.z += cos(uTime * 1.8 + pos.y * 2.0) * (swayStrength * 0.5);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const seaweedShaderMaterial = new THREE.ShaderMaterial({
            vertexShader: seaweedVertexShader,
            fragmentShader: fishFragmentShader,
            uniforms: {
                uTime: { value: 0.0 },
                uTexture: { value: null },
                uHasTexture: { value: 0 },
                uColor: { value: new THREE.Color(0x2e8b57) }
            },
            side: THREE.DoubleSide
        });

        const directionalLight = new THREE.DirectionalLight(0xffffff, 3); 
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048; 
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0001; 
        directionalLight.shadow.normalBias = 0.02; 

        const customCatToonMaterial = new THREE.ShaderMaterial({
            vertexShader: toonVertexShader,
            fragmentShader: toonFragmentShader,
            uniforms: {
                uTexture: { value: null },
                uHasTexture: { value: 0 },
                uBaseColor: { value: new THREE.Color(0xffffff) },
                uLightPosition: { value: directionalLight.position }
            }
        });

        // Scene & Camera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x867a96);
        scene.add(directionalLight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const defaultCameraPos = new THREE.Vector3(1.5, 6.6, 15.5);
        const defaultLookAt = new THREE.Vector3(0.8, 5.0, 0);
        
        let targetCameraPos = defaultCameraPos.clone();
        let targetLookAt = defaultLookAt.clone();
        let isMovingCamera = false;
        
        camera.position.copy(defaultCameraPos);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.target.copy(defaultLookAt);

        // Environment
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/qwantani_dusk_2_puresky_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.FloatType) 
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox; 
                texture.dispose();
                pmremGenerator.dispose();
            });

        // VideoTexture Setup
        const video = document.getElementById('myVideo');
        video.crossOrigin = 'anonymous'; 

        const playVideo = () => {
            if (video.paused) {
                video.play().catch(e => console.log('Autoplay waiting for user gesture'));
            }
        };

        video.addEventListener('canplay', playVideo);

        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.generateMipmaps = false;
        videoTexture.format = THREE.RGBAFormat;
        videoTexture.flipY = false;

        // Material เฉพาะสำหรับวิดีโอ
        const videoMaterial = new THREE.MeshBasicMaterial({
            map: videoTexture,
            side: THREE.DoubleSide
        });

        const targetPlanes = {}; 

        // โหลดโมเดล
        let myModel;
        let mixer;
        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load('https://nichapa67.github.io/nichapa.github.io/mymodel_web.glb', 
            (gltf) => {
                myModel = gltf.scene;
                myModel.rotation.y = -Math.PI / 2;
                scene.add(myModel);

                myModel.updateMatrixWorld(true);

                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(myModel);

                    const clip1 = THREE.AnimationClip.findByName(gltf.animations, 'Action');
                    if (clip1) mixer.clipAction(clip1).play();

                    const clip2 = THREE.AnimationClip.findByName(gltf.animations, 'clock1');
                    if (clip2) mixer.clipAction(clip2).play();

                    const clip3 = THREE.AnimationClip.findByName(gltf.animations, 'clock2');
                    if (clip3) mixer.clipAction(clip3).play();
                }

                const fixTexture = (tex) => {
                    if (tex) {
                        tex.minFilter = THREE.LinearMipmapLinearFilter;
                        tex.magFilter = THREE.LinearFilter;
                        tex.generateMipmaps = true;
                        tex.needsUpdate = true;
                    }
                };

                myModel.traverse((node) => {
                    const rawName = node.name;
                    const nameLower = rawName.toLowerCase();
                    const cleanName = nameLower.replace(/[\._\s]/g, '');

                    // บันทึกกรอบรูปเป้าหมาย
                    if (cleanName === 'plane004' || cleanName === 'plane012') {
                        targetPlanes['boardskill'] = node;
                    }
                    if (cleanName === 'plane001' || cleanName === 'plane009') {
                        targetPlanes['boardme'] = node;
                    }
                    if (cleanName === 'plane003' || (cleanName === 'plane' && node.parent && node.parent.name.toLowerCase().includes('003'))) {
                        targetPlanes['boardproject'] = node;
                    }
                    if (cleanName === 'plane003' || cleanName === 'plane004') {
                        node.castShadow = false;    // ปิดการสร้างเงา
                        node.receiveShadow = false; // ปิดการรับเงา เพื่อไม่ให้มืด

                        if (node.material && node.material.map) {
                            node.material = new THREE.MeshBasicMaterial({
                                map: node.material.map,
                                side: THREE.DoubleSide
                            });
                        }
                    }

                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;

                        // VideoTexture ให้กรอบรูป Plane.008 
                        if (cleanName === 'plane008' || rawName === 'Plane.008' || rawName === 'Plane') {
                            node.material = videoMaterial;
                        }
                        else if (nameLower.includes('agua') || nameLower.includes('aquario') || nameLower.includes('water')) {
                            node.material.transparent = true;
                            node.material.depthWrite = false; 
                            node.renderOrder = 1; 
                        }
                        else if (nameLower.includes('alga') || nameLower.includes('seaweed')) {
                            node.renderOrder = 0;
                            const oldMat = node.material;
                            const weedMat = seaweedShaderMaterial.clone();
                            if (oldMat && oldMat.map) {
                                weedMat.uniforms.uTexture.value = oldMat.map;
                                weedMat.uniforms.uHasTexture.value = 1;
                            } else if (oldMat && oldMat.color) {
                                weedMat.uniforms.uColor.value.copy(oldMat.color);
                            }
                            node.material = weedMat;
                        }
                        else if (nameLower.includes('peixe') || nameLower.includes('goldfish') || nameLower.includes('fish')) {
                            node.renderOrder = 0;
                            const oldMat = node.material;
                            const fishMat = fishShaderMaterial.clone();
                            if (oldMat && oldMat.map) {
                                fishMat.uniforms.uTexture.value = oldMat.map;
                                fishMat.uniforms.uHasTexture.value = 1;
                            } else if (oldMat && oldMat.color) {
                                fishMat.uniforms.uColor.value.copy(oldMat.color);
                            }
                            node.material = fishMat;
                        } 
                        else if (node.name.includes('Cat')) {
                            const oldMat = node.material;
                            const catMat = customCatToonMaterial.clone();
                            if (oldMat && oldMat.map) {
                                catMat.uniforms.uTexture.value = oldMat.map;
                                catMat.uniforms.uHasTexture.value = 1;
                            } else if (oldMat && oldMat.color) {
                                catMat.uniforms.uBaseColor.value.copy(oldMat.color);
                                catMat.uniforms.uHasTexture.value = 0;
                            }
                            node.material = catMat;
                        } else if (node.material) {
                            fixTexture(node.material.map);
                            fixTexture(node.material.normalMap);
                            fixTexture(node.material.roughnessMap);
                        }
                    }
                });

                const loadingElem = document.getElementById('loading');
                if (loadingElem) loadingElem.style.display = 'none';
            }, 
            undefined, 
            (error) => {
                console.error('Error loading GLB:', error);
                const loadingElem = document.getElementById('loading');
                if (loadingElem) loadingElem.innerText = 'Error loading model';
            }
        );

        // คลิกและเลื่อนกล้อง
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerup', (event) => {
            if (event.target.id === 'resetBtn') return;
            playVideo();

            if (!myModel) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(myModel.children, true);
            if (intersects.length === 0) return;

            // คลิกที่หน้าจอแล็ปท็อปเพื่อเปิดลิงก์
            for (let i = 0; i < intersects.length; i++) {
                const objName = intersects[i].object.name.toLowerCase().replace(/[\._\s]/g, '');
                if (objName === 'plane003' || objName === 'plane') {
                    window.open('https://nichapa67.github.io/nichapa.github.io/', '_blank');
                    return;
                }
            }

            let hitBoardKey = null;

            for (let i = 0; i < intersects.length; i++) {
                let cur = intersects[i].object;
                while (cur && cur !== myModel) {
                    const n = cur.name.toLowerCase();
                    if (n.includes('boardskill')) { hitBoardKey = 'boardskill'; break; }
                    if (n.includes('boardme')) { hitBoardKey = 'boardme'; break; }
                    if (n.includes('boardproject')) { hitBoardKey = 'boardproject'; break; }
                    cur = cur.parent;
                }
                if (hitBoardKey) break;
            }

            if (hitBoardKey) {
                const targetNode = targetPlanes[hitBoardKey];
                if (targetNode) {
                    targetNode.updateWorldMatrix(true, false);
                    const box = new THREE.Box3().setFromObject(targetNode);
                    const centerPos = new THREE.Vector3();
                    box.getCenter(centerPos);

                    targetLookAt.copy(centerPos);

                    const targetQuaternion = new THREE.Quaternion();
                    targetNode.getWorldQuaternion(targetQuaternion);

                    if (hitBoardKey === 'boardproject') {
                        targetCameraPos.set(-6.850, 3.905, 2.450);
                        targetLookAt.set(-6.523, 3.624, 3.427);
                    } 
                    else if (hitBoardKey === 'boardme') {
                        targetCameraPos.set(centerPos.x, centerPos.y, centerPos.z + 2.0);
                    } 
                    else if (hitBoardKey === 'boardskill') {
                        targetCameraPos.set(centerPos.x, centerPos.y, centerPos.z - 1.3);
                    }

                    isMovingCamera = true;
                    controls.enabled = false;
                    document.getElementById('resetBtn').style.display = 'block';
                }
            }
        });

        // ปุ่ม Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            targetCameraPos.copy(defaultCameraPos);
            targetLookAt.copy(defaultLookAt);
            isMovingCamera = true;
            controls.enabled = false;
            document.getElementById('resetBtn').style.display = 'none'; 
        });

        const clock = new THREE.Clock();

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (mixer) {
                mixer.update(delta);
            }

            if (myModel) {
                myModel.traverse((node) => {
                    if (node.isMesh && node.material && node.material.uniforms && node.material.uniforms.uTime) {
                        node.material.uniforms.uTime.value = elapsedTime;
                    }
                });
            }

            // Lerp ย้ายกล้อง
            if (isMovingCamera) {
                camera.position.lerp(targetCameraPos, 0.08);
                controls.target.lerp(targetLookAt, 0.08);

                if (camera.position.distanceTo(targetCameraPos) < 0.08) {
                    isMovingCamera = false;
                    controls.enabled = true; 
                }
            }

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
