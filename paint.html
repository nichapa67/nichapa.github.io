<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .tool-btn.active {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0284c7;
            font-weight: normal;
        }
        .tool-btn canvas {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
        }
        .tool-btn span {
            font-size: 12px;
        }
        .key-hint {
            font-size: 10px;
            color: #64748b;
            background: #e2e8f0;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
        }
        .separator {
            width: 2px;
            height: 50px;
            background: #e2e8f0;
            margin: 0 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        .size-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .size-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #sizeInput {
            width: 45px;
            height: 28px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        #sizeInput::-webkit-outer-spin-button,
        #sizeInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #sizeInput[type=number] {
            -moz-appearance: textfield;
            appearance: textfield
        }
        #canvas-container {
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            background: white;
        }
        #paintCanvas {
            display: block;
            cursor: crosshair;
            /* เพิ่มเพื่อให้เห็นขอบพิกเซลชัดเจนแบบ Pixel Art */
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn active" onclick="selectTool('pencil')" id="btn-pencil">
            <canvas id="icon-pencil" width="32" height="32"></canvas>
            <span>ดินสอ</span>
            <span class="key-hint">P</span>
        </button>
        <button class="tool-btn" onclick="selectTool('line')" id="btn-line">
            <canvas id="icon-line" width="32" height="32"></canvas>
            <span>เส้นตรง</span>
            <span class="key-hint">L</span>
        </button>
        <button class="tool-btn" onclick="selectTool('rect')" id="btn-rect">
            <canvas id="icon-rect" width="32" height="32"></canvas>
            <span>สี่เหลี่ยม</span>
            <span class="key-hint">R</span>
        </button>
        <button class="tool-btn" onclick="selectTool('ellipse')" id="btn-ellipse">
            <canvas id="icon-ellipse" width="32" height="32"></canvas>
            <span>วงรี/กลม</span>
            <span class="key-hint">O</span>
        </button>
        <button class="tool-btn" onclick="selectTool('eraser')" id="btn-eraser">
            <canvas id="icon-eraser" width="32" height="32"></canvas>
            <span>ยางลบ</span>
            <span class="key-hint">E</span>
        </button>

        <div class="separator"></div>

        <div class="control-group">
            <span>สี</span>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="separator"></div>

        <div class="control-group">
            <span>ขนาด</span>
            <div class="size-controls">
                <button class="size-btn" onclick="adjustSize(-1)">-</button>
                <input type="number" id="sizeInput" value="1" min="1" max="100">
                <button class="size-btn" onclick="adjustSize(1)">+</button>
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="paintCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        //ภาพปุ่ม
        const sprites = {
            pencil: [
                [null, null, null, null, null, null, 0xef4444, 0xfca5a5],
                [null, null, null, null, null, 0xef4444, 0xfca5a5, 0xef4444],
                [null, null, null, null, 0xf59e0b, 0xfcd34d, 0xef4444, null],
                [null, null, null, 0xf59e0b, 0xfcd34d, 0xf59e0b, null, null],
                [null, null, 0xf59e0b, 0xfcd34d, 0xf59e0b, null, null, null],
                [null, 0xfde047, 0xfcd34d, 0xf59e0b, null, null, null, null],
                [ 0x0f172a, 0xfde047, 0xf59e0b, null, null, null, null, null],
                [0x0f172a,  0x0f172a, null, null, null, null, null, null]
            ],

            line: [
                [null, null, null, null, null, null, null, 0x3b82f6],
                [null, null, null, null, null, null, 0x3b82f6, null],
                [null, null, null, null, null, 0x3b82f6, null, null],
                [null, null, null, null, 0x3b82f6, null, null, null],
                [null, null, null, 0x3b82f6, null, null, null, null],
                [null, null, 0x3b82f6, null, null, null, null, null],
                [null, 0x3b82f6, null, null, null, null, null, null],
                [0x3b82f6, null, null, null, null, null, null, null]
            ],

            rect: [
                [null, null, null, null, null, null, null, null],
                [null, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, null],
                [null, null, null, null, null, null, null, null]
            ],

            ellipse: [
                [null, null, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, null, null],
                [null, 0x8b5cf6, 0x8b5cf6, null, null, 0x8b5cf6, 0x8b5cf6, null],
                [0x8b5cf6, 0x8b5cf6, null, null, null, null, 0x8b5cf6, 0x8b5cf6],
                [0x8b5cf6, null, null, null, null, null, null, 0x8b5cf6],
                [0x8b5cf6, null, null, null, null, null, null, 0x8b5cf6],
                [0x8b5cf6, 0x8b5cf6, null, null, null, null, 0x8b5cf6, 0x8b5cf6],
                [null, 0x8b5cf6, 0x8b5cf6, null, null, 0x8b5cf6, 0x8b5cf6, null],
                [null, null, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, null, null]
            ],

            eraser: [
                [null, null, null, null, null, null, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0x38bdf8, 0x38bdf8, 0x38bdf8, 0x38bdf8, null, null],
                [null, null, 0x38bdf8, 0x38bdf8, 0x38bdf8, 0x38bdf8, null, null]
            ]
        };

        function drawSpriteToCanvas(canvasId, spriteArray) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const pixelSize = canvas.width / 8;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const colorCode = spriteArray[r][c];
                    if (colorCode !== null) {
                        ctx.fillStyle = '#' + colorCode.toString(16).padStart(6, '0');
                        ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

        window.onload = () => {
            drawSpriteToCanvas('icon-pencil', sprites.pencil);
            drawSpriteToCanvas('icon-line', sprites.line);
            drawSpriteToCanvas('icon-rect', sprites.rect);
            drawSpriteToCanvas('icon-ellipse', sprites.ellipse);
            drawSpriteToCanvas('icon-eraser', sprites.eraser);
        };

        // paint
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizeInput = document.getElementById('sizeInput');

        let currentTool = 'pencil';
        let currentColor = '#000000';
        let currentSize = 1;
        let isDrawing = false;
        let startX = 0;
        let startY = 0;
        let lastX = 0;
        let lastY = 0;

        
        let imageData = ctx.createImageData(canvas.width, canvas.height);
        let pixels = imageData.data;
        let snapshotPixels = new Uint8ClampedArray(pixels.length); // เก็บภาพชั่วคราว

       
        for (let i = 0; i < pixels.length; i += 4) {
            pixels[i] = 255;     // R
            pixels[i + 1] = 255; // G
            pixels[i + 2] = 255; // B
            pixels[i + 3] = 255; // A
        }
        ctx.putImageData(imageData, 0, 0);

        // แปลง Hex เป็น RGB 
        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            return {
                r: (bigint >> 16) & 255,
                g: (bigint >> 8) & 255,
                b: bigint & 255
            };
        }



        // วาดพิกเซลลงใน Array
        function putPixel(x, y, r, g, b, a = 255, size = 1) {
            const half = Math.floor(size / 2);
            // วาดเป็นบล็อกสี่เหลี่ยมตามขนาด
            for (let dy = -half; dy < size - half; dy++) {
                for (let dx = -half; dx < size - half; dx++) {
                    const px = Math.floor(x + dx);
                    const py = Math.floor(y + dy);
                    // ตรวจสอบไม่ให้ออกนอกขอบจอ
                    if (px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                        const idx = (py * canvas.width + px) * 4;
                        pixels[idx] = r;
                        pixels[idx + 1] = g;
                        pixels[idx + 2] = b;
                        pixels[idx + 3] = a;
                    }
                }
            }
        }

        // วาดเส้นตรง
        function drawLine(x1, y1, x2, y2, r, g, b, a = 255, size = 1) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (absDx === 0 && absDy === 0) {
                putPixel(x1, y1, r, g, b, a, size);
                return;
            }

            if (absDx > absDy) {
                const m = dy / dx;
                const c = y1 - m * x1;
                const start = Math.min(x1, x2);
                const end = Math.max(x1, x2);
                for (let x = start; x <= end; x++) {
                    const y = Math.round(m * x + c);
                    putPixel(x, y, r, g, b, a, size);
                }
            } else {
                const m = dx / dy;
                const c = x1 - m * y1;
                const start = Math.min(y1, y2);
                const end = Math.max(y1, y2);
                for (let y = start; y <= end; y++) {
                    const x = Math.round(m * y + c);
                    putPixel(x, y, r, g, b, a, size);
                }
            }
        }

        // วาดสี่เหลี่ยม
        function drawRect(x1, y1, x2, y2, r, g, b, a = 255, size = 1) {
            drawLine(x1, y1, x2, y1, r, g, b, a, size); // บน
            drawLine(x2, y1, x2, y2, r, g, b, a, size); // ขวา
            drawLine(x2, y2, x1, y2, r, g, b, a, size); // ล่าง
            drawLine(x1, y2, x1, y1, r, g, b, a, size); // ซ้าย
        }

        // วาดวงรี/วงกลม
        function drawEllipse(cx, cy, rx, ry, rColor, gColor, bColor, a = 255, size = 1) {
            if (rx === 0 && ry === 0) return;
            const perimeter = Math.PI * 2 * Math.max(rx, ry);
            const step = 1 / perimeter; 
            for (let t = 0; t < Math.PI * 2; t += step) {
                const x = Math.round(cx + rx * Math.cos(t));
                const y = Math.round(cy + ry * Math.sin(t));
                putPixel(x, y, rColor, gColor, bColor, a, size);
            }
        }

        // ปุ่มกด
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tool}`).classList.add('active');
        }

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        function adjustSize(delta) {
            currentSize = Math.max(1, Math.min(100, currentSize + delta));
            sizeInput.value = currentSize;
        }

        sizeInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            if (!isNaN(val) && val >= 1) currentSize = Math.min(100, val);
        });

        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            switch(e.key.toLowerCase()) {
                case 'p': selectTool('pencil'); break;
                case 'l': selectTool('line'); break;
                case 'r': selectTool('rect'); break;
                case 'o': selectTool('ellipse'); break;
                case 'e': selectTool('eraser'); break;
                case '+': case '=': adjustSize(1); break;
                case '-': case '_': adjustSize(-1); break;
            }
        });
        
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.floor(e.clientX - rect.left),
                y: Math.floor(e.clientY - rect.top)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            startX = pos.x; startY = pos.y;
            lastX = pos.x; lastY = pos.y;

            snapshotPixels.set(pixels);

            let color = currentTool === 'eraser' ? {r: 255, g: 255, b: 255} : hexToRgb(currentColor);

            if (currentTool === 'pencil' || currentTool === 'eraser') {
                putPixel(startX, startY, color.r, color.g, color.b, 255, currentSize);
                ctx.putImageData(imageData, 0, 0); // Render ออกจอ
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            let color = currentTool === 'eraser' ? {r: 255, g: 255, b: 255} : hexToRgb(currentColor);

            if (currentTool === 'pencil' || currentTool === 'eraser') {
                drawLine(lastX, lastY, pos.x, pos.y, color.r, color.g, color.b, 255, currentSize);
                ctx.putImageData(imageData, 0, 0);
                lastX = pos.x;
                lastY = pos.y;
            } 
            else if (['line', 'rect', 'ellipse'].includes(currentTool)) {
                pixels.set(snapshotPixels);

                if (currentTool === 'line') {
                    drawLine(startX, startY, pos.x, pos.y, color.r, color.g, color.b, 255, currentSize);
                } else if (currentTool === 'rect') {
                    drawRect(startX, startY, pos.x, pos.y, color.r, color.g, color.b, 255, currentSize);
                } else if (currentTool === 'ellipse') {
                    const rx = Math.abs(pos.x - startX) / 2;
                    const ry = Math.abs(pos.y - startY) / 2;
                    const cx = startX + (pos.x - startX) / 2;
                    const cy = startY + (pos.y - startY) / 2;
                    drawEllipse(cx, cy, rx, ry, color.r, color.g, color.b, 255, currentSize);
                }
                ctx.putImageData(imageData, 0, 0); // Render ออกจอ
            }
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);
    </script>
</body>
</html>
