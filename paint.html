<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            background: white;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .tool-btn.active {
            background: #e0f2fe;
            border-color: #0284c7;
            color: #0284c7;
            font-weight: normal;
        }
        .tool-btn canvas {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
        }
        .tool-btn span {
            font-size: 12px;
        }
        .key-hint {
            font-size: 10px;
            color: #64748b;
            background: #e2e8f0;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
        }
        .separator {
            width: 2px;
            height: 50px;
            background: #e2e8f0;
            margin: 0 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        .size-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .size-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #cbd5e1;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        #sizeInput {
            width: 45px;
            height: 28px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        #sizeInput::-webkit-outer-spin-button,
        #sizeInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #sizeInput[type=number] {
            -moz-appearance: textfield;
            appearance: textfield
        }
        #canvas-container {
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            background: white;
        }
        #paintCanvas {
            display: block;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="tool-btn active" onclick="selectTool('pencil')" id="btn-pencil">
            <canvas id="icon-pencil" width="32" height="32"></canvas>
            <span>ดินสอ</span>
            <span class="key-hint">P</span>
        </button>
        <button class="tool-btn" onclick="selectTool('line')" id="btn-line">
            <canvas id="icon-line" width="32" height="32"></canvas>
            <span>เส้นตรง</span>
            <span class="key-hint">L</span>
        </button>
        <button class="tool-btn" onclick="selectTool('rect')" id="btn-rect">
            <canvas id="icon-rect" width="32" height="32"></canvas>
            <span>สี่เหลี่ยม</span>
            <span class="key-hint">R</span>
        </button>
        <button class="tool-btn" onclick="selectTool('ellipse')" id="btn-ellipse">
            <canvas id="icon-ellipse" width="32" height="32"></canvas>
            <span>วงรี/กลม</span>
            <span class="key-hint">O</span>
        </button>
        <button class="tool-btn" onclick="selectTool('eraser')" id="btn-eraser">
            <canvas id="icon-eraser" width="32" height="32"></canvas>
            <span>ยางลบ</span>
            <span class="key-hint">E</span>
        </button>

        <div class="separator"></div>

        <div class="control-group">
            <span>สี</span>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="separator"></div>

        <!-- --- เปลี่ยนมาใช้ช่อง input เพื่อให้พิมพ์เลขเองได้ --- -->
        <div class="control-group">
            <span>ขนาด</span>
            <div class="size-controls">
                <button class="size-btn" onclick="adjustSize(-1)">-</button>
                <input type="number" id="sizeInput" value="5" min="1" max="100">
                <button class="size-btn" onclick="adjustSize(1)">+</button>
            </div>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="paintCanvas" width="800" height="500"></canvas>
    </div>

    <script>
        // --- 1. ข้อมูลรูปภาพปุ่ม (8x8 Sprite Array) ---
        const sprites = {
            pencil: [
                [null, null, null, null, null, null, 0xef4444, 0xfca5a5],
                [null, null, null, null, null, 0xef4444, 0xfca5a5, 0xef4444],
                [null, null, null, null, 0xf59e0b, 0xfcd34d, 0xef4444, null],
                [null, null, null, 0xf59e0b, 0xfcd34d, 0xf59e0b, null, null],
                [null, null, 0xf59e0b, 0xfcd34d, 0xf59e0b, null, null, null],
                [null, 0xfde047, 0xfcd34d, 0xf59e0b, null, null, null, null],
                [ 0x0f172a, 0xfde047, 0xf59e0b, null, null, null, null, null],
                [0x0f172a,  0x0f172a, null, null, null, null, null, null]
            ],
            line: [
                [null, null, null, null, null, null, null, 0x3b82f6],
                [null, null, null, null, null, null, 0x3b82f6, null],
                [null, null, null, null, null, 0x3b82f6, null, null],
                [null, null, null, null, 0x3b82f6, null, null, null],
                [null, null, null, 0x3b82f6, null, null, null, null],
                [null, null, 0x3b82f6, null, null, null, null, null],
                [null, 0x3b82f6, null, null, null, null, null, null],
                [0x3b82f6, null, null, null, null, null, null, null]
            ],
            rect: [
                [null, null, null, null, null, null, null, null],
                [null, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, null, null, null, null, 0x10b981, null],
                [null, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, 0x10b981, null],
                [null, null, null, null, null, null, null, null]
            ],
            ellipse: [
                [null, null, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, null, null],
                [null, 0x8b5cf6, 0x8b5cf6, null, null, 0x8b5cf6, 0x8b5cf6, null],
                [0x8b5cf6, 0x8b5cf6, null, null, null, null, 0x8b5cf6, 0x8b5cf6],
                [0x8b5cf6, null, null, null, null, null, null, 0x8b5cf6],
                [0x8b5cf6, null, null, null, null, null, null, 0x8b5cf6],
                [0x8b5cf6, 0x8b5cf6, null, null, null, null, 0x8b5cf6, 0x8b5cf6],
                [null, 0x8b5cf6, 0x8b5cf6, null, null, 0x8b5cf6, 0x8b5cf6, null],
                [null, null, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, 0x8b5cf6, null, null]
            ],
            eraser: [
                [null, null, null, null, null, null, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0xf43f5e, 0xf43f5e, 0xf43f5e, 0xf43f5e, null, null],
                [null, null, 0x38bdf8, 0x38bdf8, 0x38bdf8, 0x38bdf8, null, null],
                [null, null, 0x38bdf8, 0x38bdf8, 0x38bdf8, 0x38bdf8, null, null]
            ]
        };

        // ฟังก์ชันวาด Sprite ลงบน Canvas ของปุ่ม
        function drawSpriteToCanvas(canvasId, spriteArray) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const pixelSize = canvas.width / 8; // ขนาด 8x8 block

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const colorCode = spriteArray[r][c];
                    if (colorCode !== null) {
                        ctx.fillStyle = '#' + colorCode.toString(16).padStart(6, '0');
                        ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
                    }
                }
            }
        }

        // วาดไอคอนปุ่มทั้งหมดเมื่อโหลดหน้าเว็บ
        window.onload = () => {
            drawSpriteToCanvas('icon-pencil', sprites.pencil);
            drawSpriteToCanvas('icon-line', sprites.line);
            drawSpriteToCanvas('icon-rect', sprites.rect);
            drawSpriteToCanvas('icon-ellipse', sprites.ellipse);
            drawSpriteToCanvas('icon-eraser', sprites.eraser);
        };

        // --- 2. ระบบจัดการ State ของ Paint ---
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const sizeInput = document.getElementById('sizeInput'); // --- เปลี่ยนจาก sizeDisplay มาเป็น sizeInput ---

        let currentTool = 'pencil';
        let currentColor = '#000000';
        let currentSize = 5;
        let isDrawing = false;
        let startX = 0;
        let startY = 0;
        let snapshot = null; // เก็บภาพก่อนลากรูปทรง

        // ตั้งค่าเริ่มต้นพื้นหลังสีขาว
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- 3. ระบบเลือกเครื่องมือและปรับขนาด ---
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${tool}`).classList.add('active');
        }

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        // --- ปรับปรุงฟังก์ชันปรับขนาดให้เชื่อมกับ Input ---
        function adjustSize(delta) {
            currentSize = Math.max(1, Math.min(100, currentSize + delta));
            sizeInput.value = currentSize;
        }

        // --- เพิ่ม Event รับค่าเมื่อผู้ใช้พิมพ์ตัวเลขลงไปตรงๆ ---
        sizeInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            if (!isNaN(val) && val >= 1) {
                currentSize = Math.min(100, val);
            }
        });

        sizeInput.addEventListener('blur', () => {
            if (!sizeInput.value || parseInt(sizeInput.value, 10) < 1) {
                currentSize = 1;
                sizeInput.value = currentSize;
            }
        });

        // --- 4. ระบบคีย์ลัดบน Keyboard ---
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return; // ป้องกันตอนพิมพ์ในช่อง input อื่นๆ

            switch(e.key.toLowerCase()) {
                case 'p': selectTool('pencil'); break;
                case 'l': selectTool('line'); break;
                case 'r': selectTool('rect'); break;
                case 'o': selectTool('ellipse'); break;
                case 'e': selectTool('eraser'); break;
                case '+':
                case '=': adjustSize(1); break;
                case '-':
                case '_': adjustSize(-1); break;
            }
        });

        // --- 5. ระบบการวาดภาพบน Canvas ---
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            startX = pos.x;
            startY = pos.y;

            ctx.beginPath();
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            if (currentTool === 'eraser') {
                ctx.strokeStyle = '#FFFFFF'; // ยางลบใช้สีขาวทับ
            } else {
                ctx.strokeStyle = currentColor;
            }

            // บันทึกภาพหน้าจอก่อนวาดรูปทรง (เส้น, สี่เหลี่ยม, วงรี)
            if (['line', 'rect', 'ellipse'].includes(currentTool)) {
                snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            } else {
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX, startY);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);

            if (currentTool === 'pencil' || currentTool === 'eraser') {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (['line', 'rect', 'ellipse'].includes(currentTool)) {
                // คืนค่าภาพเดิมก่อนจะวาดรูปร่างใหม่ที่ตำแหน่งเมาส์ปัจจุบัน
                ctx.putImageData(snapshot, 0, 0);
                ctx.beginPath();

                if (currentTool === 'line') {
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(pos.x, pos.y);
                } else if (currentTool === 'rect') {
                    const width = pos.x - startX;
                    const height = pos.y - startY;
                    ctx.rect(startX, startY, width, height);
                } else if (currentTool === 'ellipse') {
                    const radiusX = Math.abs((pos.x - startX) / 2);
                    const radiusY = Math.abs((pos.y - startY) / 2);
                    const centerX = startX + (pos.x - startX) / 2;
                    const centerY = startY + (pos.y - startY) / 2;
                    ctx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, 2 * Math.PI);
                }
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false);
    </script>
</body>
</html>
